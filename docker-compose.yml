# 国家队买卖A股日报 + 海外QDII定投决策面板 —— Docker Compose 编排
#
# 五个服务共用同一个镜像与同一个数据卷：
#   gateway     : 单端口入口（容器 38881 / 宿主 48881）—— 对外只暴露这一个端口，
#                 把 / 与 /nt/ 分发到国家队、/qdii/ 分发到 QDII
#   ntt-web     : 国家队看板页面 + /api/data（内部端口 5000，不对外映射）
#   ntt-cron    : 国家队定时抓取（06:00/17:10 全量，盘中逐笔采样）
#   qdii-web    : QDII 决策看板 + /api/qdii/*（内部端口 5001，不对外映射）
#   qdii-cron   : QDII 定时抓取（双日历：A股交易日 09:00 限额/费率/跟踪误差，
#                 美股交易日 14:30 信号，A股交易日 14:30 溢价）
#
# 一个端口看两个面板：
#   http://<host>:48881/        国家队看板（页头选项卡可切到 QDII）
#   http://<host>:48881/qdii/   QDII 面板
#
# 一键启动：  docker compose up -d --build
# 查看状态：  docker compose ps
# 查看日志：  docker compose logs -f qdii-cron
services:
  # ===== 单端口入口 =====
  gateway:
    build: .
    image: invest-radar:latest
    container_name: ntt-gateway
    environment:
      APP_ROLE: gateway
      TZ: ${TZ:-Asia/Shanghai}
      GATEWAY_PORT: ${GATEWAY_PORT:-38881}
      # 上游按容器名寻址（compose 内网），端口是**容器内部端口**
      NT_UPSTREAM: http://web:${PORT:-5000}
      QDII_UPSTREAM: http://qdii-web:${QDII_PORT:-5001}
      QDII_PREFIX: ${QDII_PREFIX:-/qdii}
      NT_PREFIX: ${NT_PREFIX:-/nt}
    ports:
      # 公网/宿主机只需这一个端口：48881 -> 容器 38881
      - "${GATEWAY_HOST_PORT:-48881}:${GATEWAY_PORT:-38881}"
    depends_on:
      - web
      - qdii-web
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    image: invest-radar:latest
    container_name: ntt-web
    environment:
      APP_ROLE: web
      TZ: ${TZ:-Asia/Shanghai}
      PORT: ${PORT:-5000}
      NT_DB_PATH: /app/data/data.db
      # 抓取交给 cron 容器：避免重复请求，也避免两个容器争抢同一个 SQLite 写锁
      NT_AUTO_ENSURE: "0"
      # 对端面板地址（页头选项卡互跳）：同域不同路径时可直接写相对路径（/qdii/），
      # 跨域名写完整 URL；留空则回退「本端口 +1」推断。
      PEER_URL: ${PEER_URL:-}
      # 站点路径前缀：一般不需要（gateway 会剥掉 /nt /qdii 前缀）；
      # 只有绕过 gateway、由 NPM 直接代理到本容器且保留前缀时才需要。
      BASE_PATH: ${BASE_PATH:-}
    # 端口不对外映射：统一由 gateway 的 38881 入口访问。
    # 临时排障需要直连时再解开下面两行（改成不冲突的宿主端口）。
    # ports:
    #   - "18080:${PORT:-5000}"
    volumes:
      - ntt-data:/app/data
    restart: unless-stopped
    init: true
    # 2C2G 小规格 VPS 上与其它服务共存：给容器设资源上限，避免抓取时抢占资源
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cron:
    build: .
    image: invest-radar:latest
    container_name: ntt-cron
    environment:
      APP_ROLE: cron
      TZ: ${TZ:-Asia/Shanghai}
      NT_DB_PATH: /app/data/data.db
      SCHED_FULL_TIMES: ${SCHED_FULL_TIMES:-06:00,17:10}
      SCHED_TICK_TIMES: ${SCHED_TICK_TIMES:-10:30,11:30,14:00,14:50}
      SCHED_RUN_ON_START: ${SCHED_RUN_ON_START:-1}
      SCHED_FULL_WEEKDAY_ONLY: ${SCHED_FULL_WEEKDAY_ONLY:-1}
      SCHED_TIMEOUT: ${SCHED_TIMEOUT:-1800}
    volumes:
      - ntt-data:/app/data
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # cron 容器不提供 HTTP 端口，覆盖掉镜像自带的 /api/status 检查
      test: ["CMD", "true"]
      interval: 5m
      retries: 1

  # ===== 海外 QDII 定投决策面板 =====
  qdii-web:
    build: .
    image: invest-radar:latest
    container_name: qdii-web
    environment:
      APP_ROLE: qdii-web
      TZ: ${TZ:-Asia/Shanghai}
      QDII_PORT: ${QDII_PORT:-5001}
      # QDII 独立数据库文件，与国家队 data.db 同卷但分离
      NT_QDII_DB_PATH: /app/data/qdii.db
      # 对端面板地址（QDII → 国家队看板），可写相对路径 /nt/ 或完整 URL
      PEER_URL: ${QDII_PEER_URL:-}
      # 站点路径前缀（同 web 的 BASE_PATH，一般留空）
      BASE_PATH: ${QDII_BASE_PATH:-}
    # 端口不对外映射：统一由 gateway 的 38881 入口访问（/qdii/）
    # ports:
    #   - "18081:${QDII_PORT:-5001}"
    volumes:
      - ntt-data:/app/data
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdii-cron:
    build: .
    image: invest-radar:latest
    container_name: qdii-cron
    environment:
      APP_ROLE: qdii-cron
      TZ: ${TZ:-Asia/Shanghai}
      NT_QDII_DB_PATH: /app/data/qdii.db
      # 双日历：限额/费率/跟踪误差按 A 股交易日；美股信号按美股交易日；溢价按 A 股交易日
      QDII_SCHED_LIMITTIMES: ${QDII_SCHED_LIMITTIMES:-09:00}
      QDII_SCHED_SIGNALTIME: ${QDII_SCHED_SIGNALTIME:-14:30}
      QDII_SCHED_PREMIUMTIME: ${QDII_SCHED_PREMIUMTIME:-14:30}
      SCHED_RUN_ON_START: ${SCHED_RUN_ON_START:-1}
    volumes:
      - ntt-data:/app/data
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # cron 容器不提供 HTTP 端口，覆盖掉镜像自带的 /api/status 检查
      test: ["CMD", "true"]
      interval: 5m
      retries: 1

volumes:
  # 命名卷：国家队 data.db 与 QDII qdii.db 都在这里，重建容器不会丢
  ntt-data:
