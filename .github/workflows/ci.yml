name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: |
          python -m py_compile national_team/app.py national_team/db.py national_team/fetcher.py \
            national_team/backfill.py national_team/staticsite.py
          python -m py_compile qdii/*.py common/*.py docker/healthcheck.py

      - name: 数据层单元测试（离线）
        run: python -m unittest discover -s national_team/tests -p "test_*.py" -v

      - name: QDII 单元测试（离线，含跟踪误差合成序列）
        run: python -m unittest discover -s qdii/tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前端渲染逻辑测试（DOM 桩件，离线）
        run: node national_team/tests/test_frontend.js

      - name: 静态模式一致性测试（前端筛选 vs 服务端逻辑）
        run: node national_team/tests/test_static.js

      - name: 导出静态站（同时验证导出可用）
        run: python national_team/staticsite.py --no-sync

      - name: 静态站产物启动测试
        run: node national_team/tests/test_static_boot.js
