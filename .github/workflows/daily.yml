name: daily-update

# 每个交易日收盘后自动抓取 → 提交 docs/ → Pages（deploy from branch）自动发布。
# 调度入口已移交 cron-job.org（每天 17:00 / 06:00 北京时间经 workflow_dispatch API 触发），
# GitHub 自带 schedule 已于 2026-10-28 停用，避免双跑。

on:
  # schedule 停用中——如需恢复 GitHub 自动运行，取消下面两行注释即可：
  # schedule:
  #   - cron: "20 8 * * 1-5"    # 16:20 北京时间（收盘后首次抓取）
  #   - cron: "40 10 * * 1-5"   # 18:40 北京时间（补抓：防主力资金接口延迟）
  workflow_dispatch:           # cron-job.org 触发 + 页面右上角手动触发都走这里

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write              # 提交 docs/ 变更

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并导出静态数据（国家队）
        run: python national_team/staticsite.py

      # QDII 静态站导出前必须先抓数据。qdii.db 被 .gitignore 排除，
      # Actions runner 每次都是空库 → 如果只跑 staticsite.py，board/decision
      # 全 zero，git push 会把 docs/qdii/qdii_data.json 覆盖成空白快照。
      # 这里显式跑一次 --once（limit + signal + premium 全抓），再让
      # staticsite 从库里读。--allow-empty 不开，静默坏掉会被 skip-write 挡住。
      - name: 抓取 QDII 数据（limit+fee+te+signal+premium 全跑一遍）
        run: python qdii/qdii_scheduler.py --once
        # 抓挂了就继续，交给 staticsite 的空覆盖保护决定「保留旧值 or 覆盖」
        continue-on-error: true

      - name: 导出 QDII 静态站
        run: python qdii/staticsite.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          BJDATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          git commit -m "data: 更新 ${BJDATE} 国家队 + QDII 快照"
          # 2026-10-30 修：schedule 触发时 actions/checkout@v4 会把 HEAD 置成
          # detached（见 https://github.com/actions/checkout#usage），裸 `git push`
          # 因为没有 refspec 直接失败。目前本 workflow 靠 workflow_dispatch 走
          # 具名分支（能推），但注释掉的 schedule 一旦被取消启用就会立刻踩到 ——
          # 显式 push HEAD:${GITHUB_REF_NAME}，两种触发方式都能安全推回。
          git push origin "HEAD:${GITHUB_REF_NAME}"
