name: pages-deploy

# 代码/模板变更后重新构建并部署静态站。
# 注：daily-update 用 GITHUB_TOKEN 提交的数据变更不会触发本工作流，
# 所以那一条链路在 daily.yml 里自带部署步骤（这里是给人工提交用的）。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "templates/index.html"
      - "staticsite.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 重新导出静态站（保证产物与模板一致）
        run: python staticsite.py --no-sync

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态站
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
