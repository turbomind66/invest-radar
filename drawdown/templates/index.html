<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📉 回撤全景 · 宽基指数与场内ETF历史回撤修复</title>
<script src="echarts.min.js"></script>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1b1f24;--sub:#5b6470;--line:#e3e6ea;--up:#d92b2b;--down:#12924a;--accent:#2f5fd0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:18px}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .htitle h1{font-size:20px;margin:0 0 8px}
  .tag{font-size:12px;font-weight:400;color:var(--sub);background:#eef1f5;padding:2px 8px;border-radius:10px;margin-left:6px}
  .tabbar{display:flex;gap:6px;flex-wrap:wrap}
  .tab{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub);text-decoration:none;font-size:13px}
  .tab:hover{border-color:var(--accent);color:var(--accent)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .disclaimer-bar{background:#fff7e6;border:1px solid #ffe0a3;color:#8a5b00;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .row label{font-size:12px;color:var(--sub)}
  select,input[type=date],button{font:13px inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:4px 10px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--sub);font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:#e8efff;border-color:var(--accent);color:var(--accent)}
  .chip.ready{border-left:3px solid var(--down)}
  .chip.empty{border-left:3px solid #ccc;opacity:.6}
  #chart{width:100%;height:460px}
  .signals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
  .sig{border:1px solid var(--line);border-radius:10px;padding:12px}
  .sig h3{margin:0 0 6px;font-size:14px}
  .sig .big{font-size:24px;font-weight:700;color:var(--down)}
  .sig .big.deep{color:var(--up)}
  .sig dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px}
  .sig dt{color:var(--sub)} .sig dd{margin:0;text-align:right}
  .sig .hint{margin-top:8px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:6px}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f7f8fa;color:var(--sub);font-weight:600;position:sticky;top:0;cursor:pointer}
  thead th:hover{color:var(--accent)}
  .up{color:var(--up)} .down{color:var(--down)}
  .tbl-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--sub)}
  .muted{color:var(--sub);font-size:12px}
  .loading{padding:40px;text-align:center;color:var(--sub)}
  .evt-note{margin-top:8px;padding:9px 12px;border-left:3px solid var(--accent);background:#f2f6ff;border-radius:8px;font-size:13px;line-height:1.65;color:var(--ink)}
  .evt-note b{color:var(--accent)}
  .evt-note .evt-date{color:var(--sub);font-size:12px;margin-left:8px}
  .evt-note .evt-x{float:right;cursor:pointer;color:var(--sub);font-size:14px;line-height:1;padding:0 2px}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htitle">
      <h1>📉 回撤全景 <span class="tag">宽基指数与场内ETF · 全历史回撤与修复</span></h1>
      <nav class="tabbar" id="tabbar">
        <a class="tab" href="../" title="汪汪队 A股日报">🛡️ 汪汪队 A股</a>
        <a class="tab" href="../qdii/" title="QDII 定投面板">📈 全球 QDII 定投</a>
        <span class="tab active">📉 回撤全景</span>
      </nav>
    </div>
    <div class="meta"><div class="muted" id="freshness">数据载入中…</div></div>
  </header>

  <div class="disclaimer-bar" role="note">⚠️ 本页历史回撤按<b>收盘价 vs 历史最高收盘价</b>计算，仅作复盘参考，<b>不构成投资建议</b>；据此操作，风险自担。</div>

  <div class="card">
    <h2>① 选择标的（可多选叠加）</h2>
    <div class="row">
      <label>周期 <select id="gran"><option value="day">日</option><option value="week">周</option><option value="month">月</option><option value="quarter">季</option><option value="year">年</option></select></label>
      <label>起 <input type="date" id="dfrom"></label>
      <label>止 <input type="date" id="dto"></label>
      <button class="primary" id="apply">应用筛选</button>
      <button id="reset">重置</button>
      <label class="toggle"><input type="checkbox" id="fxAdjust"> 剔除汇率/溢价（还原真实涨跌%）</label>
      <label id="rcSelWrap" style="display:none">还原标的 <select id="rcSel"></select></label>
    </div>
    <div class="muted" id="rcNote" style="margin-top:6px;display:none"></div>
    <div id="groups"></div>
  </div>

  <div class="card">
    <h2>② 走势与回撤 <span class="muted" id="chartHint">拖动下方滑块或滚轮缩放，点标记看大事件</span></h2>
    <div id="chart"><div class="loading">图表载入中…</div></div>
    <div id="evtNote" class="evt-note" style="display:none"></div>
  </div>

  <div class="card">
    <h2>③ 今日信号（客观指标，非买卖建议）</h2>
    <div class="signals" id="signals"></div>
  </div>

  <div class="card">
    <h2>④ 回撤明细 <span class="muted" id="tableHint"></span></h2>
    <div class="row" style="margin-bottom:10px">
      <button id="view-period" class="primary">周期汇总</button>
      <button id="view-daily">日明细</button>
      <button id="view-events">回撤事件</button>
      <span class="muted" id="linkNote">与上方图表时间窗口联动</span>
    </div>
    <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="pager"><span id="pageInfo"></span><button id="prev">上一页</button><button id="next">下一页</button></div>
  </div>

  <footer>回撤全景 __APP_VERSION__ · 数据来自公开行情接口，历史起点以各标的实际上市/发布日为准</footer>
</div>

<script>
"use strict";
var CHART = null, STATE = {ids:[],gran:"day",dfrom:"",dto:"",view:"period",page:0,fx:false,rcEtf:""};
var PAYLOAD = null, CATALOG = null, SERIES = null, TABLE = null, RECON = null;
var RAW = null, NORM_T = null;   // RAW=原始 series（缩放重归一化用）；NORM_T=防抖定时器
var EVT_PTS = [], EVT_SI = -1;   // 事件点缓存 + 其 series 索引（像素容差命中用）
var ZR_CLICK = null, ZR_MOVE = null, ZR_LAST = "";   // 自定义 zr 处理器（精确 off 用）
var RC_CACHE = {};               // 还原曲线缓存（etf → 响应）
var RC_SEQ = 0;                  // 还原请求序号（丢弃过期响应，避免快速切换时旧数据覆盖新图）

function api(path){
  var base = (window.__STATIC__ && window.__STATIC__.data_base) || "";
  if(window.__STATIC__){ return base + "data.json"; }
  return "api/dd/" + path;
}
function money(v){return v==null?"—":Number(v).toFixed(4)}
function pct(v){return v==null?"—":Number(v).toFixed(2)+"%"}
function cls(v){return v>0?"up":(v<0?"down":"")}
function fmtPct(v){return v==null?"—":(Number(v)>0?"+":"")+Number(v).toFixed(2)+"%"}
// 走势图归一化口径：每条线以「当前窗口首个有效点」为 0%
//  - 设了起始日 → 从起始日 0 起算；点重置 → 回到各标的最早上市/发布日 0 起算
//  - 不同标的价格量纲差几个数量级（3900 vs 4.15），只有百分比同轴才可比
// META 保存「seriesIndex → 日期→原始价」，供 tooltip 同时回显绝对点位
var META = {n:0, raw:{}};
function tipFmt(ps){
  if(!ps || !ps.length) return "";
  var head = ps[0].axisValueLabel || ps[0].axisValue || "";
  var html = '<div style="margin-bottom:3px;color:#8a8f98">'+head+'</div>';
  ps.forEach(function(p){
    if(p.seriesType !== "line") return;
    var y = Array.isArray(p.value) ? p.value[1] : p.value;
    if(y==null) return;
    var raw = null;
    if(p.seriesIndex < META.n && META.raw[p.seriesIndex]){
      var d = Array.isArray(p.data) ? p.data[0] : p.name;
      raw = META.raw[p.seriesIndex][d];
    }
    html += '<div style="line-height:19px">'+(p.marker||"")+p.seriesName
      + ' <b>'+fmtPct(y)+'</b>'
      + (raw!=null ? ' <span style="color:#8a8f98">点位 '+money(raw)+'</span>' : '')+'</div>';
  });
  return html;
}

function renderGroups(cat){
  CATALOG = cat;
  var box = document.getElementById("groups"); box.innerHTML="";
  cat.groups.forEach(function(g){
    var wrap = document.createElement("div"); wrap.style.marginTop="8px";
    var lab = document.createElement("label"); lab.textContent = g.label+"："; wrap.appendChild(lab);
    var chips = document.createElement("div"); chips.className="chips";
    var byId = {}; cat.assets.forEach(function(a){byId[a.id]=a});
    g.ids.forEach(function(id){
      var a = byId[id]; if(!a) return;
      var c = document.createElement("span");
      c.className = "chip " + (a.ready?"ready":"empty") + (STATE.ids.indexOf(id)>=0?" on":"");
      c.textContent = a.name + (a.ready?"":"（无数据）");
      c.title = a.name + " · 数据 " + (a.actual_from||"—") + " 起 " + (a.points||0) + " 点";
      c.onclick = function(){
        var i = STATE.ids.indexOf(id), changed = false;
        if(i>=0){
          if(STATE.ids.length>1){ STATE.ids.splice(i,1); changed=true; }
          else c.title = a.name + " · 至少保留一个标的（数据 " + (a.actual_from||"—") + " 起 " + (a.points||0) + " 点）";
        }
        else { STATE.ids.push(id); changed=true; }
        // 仅当 STATE.ids 真的变化时才翻转视觉，避免「chip 变灰但线还在」的假象
        if(changed){ c.classList.toggle("on"); refreshAll(); }
      };
      chips.appendChild(c);
    });
    wrap.appendChild(chips); box.appendChild(wrap);
  });
}

function renderSignals(sigs){
  var box = document.getElementById("signals"); box.innerHTML="";
  if(!sigs || !sigs.length){box.innerHTML='<div class="muted">暂无信号数据（请先回补历史）</div>';return}
  sigs.forEach(function(s){
    var d = document.createElement("div"); d.className="sig";
    var deep = (s.dd_rank_pct!=null && s.dd_rank_pct>=90)?" deep":"";
    d.innerHTML = '<h3>'+s.name+'</h3>'
      + '<div class="big'+deep+'">'+pct(s.dd_pct)+'</div>'
      + '<div class="muted">当前距历史高点回撤</div>'
      + '<dl>'
      + '<dt>最新收盘</dt><dd>'+money(s.close)+'</dd>'
      + '<dt>历史高点</dt><dd>'+money(s.peak)+' ('+(s.peak_date||"—")+')</dd>'
      + '<dt>回撤分位</dt><dd>'+(s.dd_rank_pct==null?"—":s.dd_rank_pct+"%")+'</dd>'
      + '<dt>距高点</dt><dd>'+(s.days_since_peak==null?"—":s.days_since_peak+" 天")+'</dd>'
      + '<dt>类似回撤修复中位数</dt><dd>'+(s.recover_days_median==null?"—":s.recover_days_median+" 天")+'</dd>'
      + '</dl><div class="hint">'+ (s.hint||"") +'</div>';
    box.appendChild(d);
  });
}

var RC_COLORS = {price:"#d92b2b", nav:"#2f5fd0", restored:"#12924a", bench:"#8a5b00"};
var RC_LABELS = {price:"场内价%（含溢价+汇率）", nav:"净值%（剔溢价，含汇率）",
  restored:"还原%（剔溢价+汇率）", bench:"基准指数%（本币）"};

function renderReconstruct(r){
  var el = document.getElementById("chart");
  if(!CHART){ el.innerHTML=""; CHART = echarts.init(el); }
  if(!r || r.error){
    el.innerHTML='<div class="loading">'+(r&&r.msg?r.msg:"该标的暂无还原数据（先跑净值回补）")+'</div>';
    CHART = null; return;
  }
  var order = ["price","nav","restored","bench"];
  var series = order.map(function(k){
    return {name:RC_LABELS[k], type:"line", data:r.curves[k], showSymbol:false,
      sampling:"lttb", lineStyle:{width:k==="restored"?2.2:1.4,
        type:k==="bench"?"dashed":"solid", color:RC_COLORS[k]},
      itemStyle:{color:RC_COLORS[k]},
      tooltip:{valueFormatter:function(v){return v==null?"—":Number(v).toFixed(2)+"%"}}};
  });
  var option = {
    animation:false,
    legend:{data:order.map(function(k){return RC_LABELS[k]}),top:0},
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},
      valueFormatter:function(v){return v==null?"—":Number(v).toFixed(2)+"%"}},
    grid:{left:60,right:24,top:34,bottom:64},
    xAxis:{type:"time"},
    yAxis:{type:"value",name:"累计涨跌%",axisLabel:{formatter:"{value}%"}},
    dataZoom:[
      {type:"inside",start:0,end:100},
      {type:"slider",bottom:6,height:20,start:0,end:100}
    ],
    series:series
  };
  CHART.setOption(option,true);
  document.getElementById("chartHint").textContent =
    r.name+" vs "+r.bench_name+" · 起点 "+r.t0+"=0% · "+r.points+" 个交易日";
  document.getElementById("rcNote").textContent = r.note;
}

function showEvt(d){
  if(!d) return;
  var el = document.getElementById("evtNote");
  if(!el) return;
  el.innerHTML = '<span class="evt-x" title="关闭">×</span><b>'+(d.name||"事件")+'</b>'
    + '<span class="evt-date">'+(d.evDate||"")+'</span><br>'+(d.evDesc||"");
  el.style.display = "block";
  var x = el.querySelector(".evt-x");
  if(x) x.onclick = function(){ el.style.display = "none"; };
}

// 走势序列构建：以 fromStr（当前窗口左边界）为归一化基准
//  - fromStr 为空 → 各线自身首个有效点（重置态：各自最早上市/发布日 = 0%）
//  - fromStr 有值 → 该日期起算（设起始日 / 拖动缩放后都以它为 0%）
// 不同标的价格量纲差几个数量级（3900 vs 4.15），只有百分比同轴才可比
function buildLines(s, fromStr){
  var bases = {}, rawMap = {}, main = [], dd = [], legend = [], evtPoints = [];
  s.series.forEach(function(line, i){
    var base = null;
    for(var k=0;k<line.line.length;k++){
      var p0 = line.line[k];
      if(p0[1]==null) continue;
      if(fromStr && String(p0[0]) < fromStr) continue;
      base = p0[1]; break;
    }
    bases[line.id] = base;
    var m = {};
    line.line.forEach(function(p){ if(p[1]!=null) m[p[0]] = p[1]; });
    rawMap[i] = m;
    legend.push(line.name);
    main.push({
      name: line.name, type:"line",
      data: line.line.map(function(p){
        // p=[date, close] → [date, 相对窗口起点累计涨跌%]，形状不变、量纲统一
        return [p[0], (base && p[1]!=null) ? +(((p[1]/base)-1)*100).toFixed(4) : null];
      }),
      xAxisIndex:0, yAxisIndex:0, showSymbol:false,
      sampling:"lttb", smooth:false,
      lineStyle:{width:1.5},
      // axis tooltip 的 valueFormatter 收到的是标量（该点的累计涨跌%），不是 [date, value] 数组
      tooltip:{valueFormatter:function(v){return fmtPct(v)}}
    });
    // 回撤线与主线同名 → 同一个图例项统一控制；否则图例只列主线名，
    // 回撤虚线不在 legend.data 里无法被隐藏，「取消沪深300后虚线还在」。
    dd.push({
      name: line.name, type:"line", data: line.dd,
      xAxisIndex:1, yAxisIndex:1, showSymbol:false, sampling:"lttb",
      lineStyle:{width:1,type:"dashed",opacity:.7},
      tooltip:{valueFormatter:function(v){return v==null?"—":Number(v).toFixed(2)+"%"}}
    });
  });
  // 事件标注用独立 scatter series 承载：markPoint 的 tooltip 受全局 axis 模式压制，
  // 悬停/点击都不出说明；scatter 可挂 item tooltip，且 tooltip.triggerOn 含 click。
  (s.events||[]).forEach(function(e){
    var hit = s.series.find(function(x){return x.id===e.target});
    if(!hit || !hit.line.length) return;
    // 窗口起点之前的事件不落在图上（否则会被挤到左边界，误导为窗口内事件）
    if(e.date < hit.line[0][0]) return;
    var pt = hit.line.find(function(p){return p[0]>=e.date});
    if(!pt) return;
    var base = bases[e.target];
    evtPoints.push({
      value:[pt[0], (base && pt[1]!=null) ? +(((pt[1]/base)-1)*100).toFixed(4) : null],
      name:e.title,
      evDate:e.date, evDesc:e.desc, evSide:e.side,
      symbol:"pin", symbolSize:e.side==="crash"?16:14,
      itemStyle:{color:e.side==="crash"?"#d92b2b":"#12924a"}
    });
  });
  // 始终保留 scatter（即使无事件）→ series 数量恒定，缩放重算可安全合并更新
  main.push({
    name:"大事件", type:"scatter", data:evtPoints,
    xAxisIndex:0, yAxisIndex:0, z:10, label:{show:false},
    tooltip:{trigger:"item", formatter:function(p){
      var d=(p&&p.data)||{};
      return '<b>'+(d.name||"")+'</b><br/>'+'事件日：'+(d.evDate||"")+
             '<br/>'+(d.evDesc||"");
    }}
  });
  return {bases:bases, rawMap:rawMap, main:main, dd:dd, legend:legend,
          evtPoints:evtPoints, n:s.series.length};
}

// dataZoom 给的是时间戳，用本地时区取日期（toISOString 会因时区差一天）
function tsToDate(ts){
  var d = new Date(ts), m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function hintText(fromStr, total){
  return "走势已统一为累计涨跌%（窗口起点=0%）· 共 "+total+" 个交易日"
    + (fromStr ? " · 自 "+fromStr+" 起算" : " · 各自最早数据点起算");
}

function renderChart(s){
  RAW = s;
  var el = document.getElementById("chart");
  // 保留用户当前的图例开关状态：notMerge 重绘会清空它，导致「刚隐藏的线又冒出来」
  var prevSelected = {};
  if(CHART){ try{ var _old=CHART.getOption(), _lg=(_old&&_old.legend&&_old.legend[0])||{};
    if(_lg.selected) prevSelected=_lg.selected; }catch(e){} }
  if(!CHART){ el.innerHTML=""; CHART = echarts.init(el); }
  var b = buildLines(s, null);
  META = {n:b.n, raw:b.rawMap};
  EVT_PTS = b.evtPoints; EVT_SI = b.main.length - 1;   // scatter 恒为 main 的最后一个
  var total = s.series.reduce(function(a,x){return a+(x.points||0)},0);
  var option = {
    animation:false,
    legend:{data:b.legend,top:0,selected:prevSelected},
    // 自定义 axis tooltip：主图显示「累计涨跌% + 原始点位」，回撤图显示回撤%
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},formatter:tipFmt},
    grid:[{left:60,right:24,top:34,height:"46%"},{left:60,right:24,top:"62%",height:"22%"}],
    xAxis:[
      {type:"time",gridIndex:0,axisLabel:{show:false}},
      {type:"time",gridIndex:1}
    ],
    yAxis:[
      {type:"value",scale:true,gridIndex:0,name:"累计涨跌%(起点0)",
       axisLabel:{formatter:"{value}%"}},
      {type:"value",max:0,gridIndex:1,name:"回撤%"}
    ],
    dataZoom:[
      {type:"inside",xAxisIndex:[0,1],start:0,end:100},
      {type:"slider",xAxisIndex:[0,1],bottom:0,height:20,start:0,end:100}
    ],
    series: b.main.concat(b.dd)
  };
  CHART.setOption(option,true);
  CHART.off("datazoom");
  CHART.on("datazoom",function(){
    if(!CHART || !RAW) return;
    var op = CHART.getOption();
    var dz = (op.dataZoom&&op.dataZoom[0])||{};
    if(dz.startValue==null || dz.endValue==null) return;
    var f = tsToDate(dz.startValue), t = tsToDate(dz.endValue);
    STATE.dfrom=f; STATE.dto=t;
    document.getElementById("dfrom").value=f; document.getElementById("dto").value=t;
    loadTable(true);
    // 缩放后以窗口左边界重新归零：不做则「输入框显示 2015、曲线仍以 1990 为 0」，口径不一致
    if(NORM_T) clearTimeout(NORM_T);
    NORM_T = setTimeout(function(){
      if(!CHART || !RAW) return;
      var bb = buildLines(RAW, f);
      META = {n:bb.n, raw:bb.rawMap};
      // 合并更新（不 notMerge）→ 保留当前缩放窗口与图例开关
      CHART.setOption({series: bb.main.concat(bb.dd)});
      var h = document.getElementById("chartHint");
      if(h) h.textContent = hintText(f, total);
    }, 260);
  });
  // 事件标注的说明：ECharts 全局 axis tooltip 会压制 scatter 的 item tooltip，
  // 这里直接监听图表事件，把说明写进图表下方的固定说明条（点击/悬停均触发）。
  CHART.off("click");
  CHART.off("mouseover");
  CHART.on("click", function(p){ if(p && p.seriesName === "大事件" && p.data) showEvt(p.data); });
  CHART.on("mouseover", function(p){ if(p && p.seriesName === "大事件" && p.data) showEvt(p.data); });
  // pin 的锚点在尖端，精确命中很难（尤其缩放后尺寸变小、点偏一两像素就没反应）。
  // 补一层像素容差反查：距最近事件点 ≤16px 即命中，点击/悬停都能稳定弹出说明。
  // 注意：只能 off 自己的处理器（无参 zr.off 会连 ECharts 内部的 zrender handler 一起清掉）。
  var zr = CHART.getZr && CHART.getZr();
  if(zr){
    if(ZR_CLICK) zr.off("click", ZR_CLICK);
    if(ZR_MOVE) zr.off("mousemove", ZR_MOVE);
    ZR_CLICK = function(e){ var hit = nearestEvt(e.offsetX, e.offsetY); if(hit) showEvt(hit); };
    ZR_MOVE = function(e){
      var hit = nearestEvt(e.offsetX, e.offsetY);
      var key = hit ? (hit.evDate + "|" + hit.name) : "";
      if(!key){ ZR_LAST = ""; return; }
      if(key !== ZR_LAST){ ZR_LAST = key; showEvt(hit); }
    };
    zr.on("click", ZR_CLICK);
    zr.on("mousemove", ZR_MOVE);
  }
}

// 距鼠标最近的图钉（pin 图形以数据点为尖端向上延伸，比较点取图形中部）
function nearestEvt(x, y){
  if(!CHART || !EVT_PTS.length || EVT_SI < 0) return null;
  var best = null, bd = 1e9;
  for(var i=0;i<EVT_PTS.length;i++){
    var p = EVT_PTS[i];
    var px = CHART.convertToPixel({seriesIndex:EVT_SI}, p.value);
    if(!px || px.length < 2) continue;
    var dx = px[0] - x, dy = (px[1] - 7) - y;
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d < bd){ bd = d; best = p; }
  }
  return (best && bd <= 16) ? best : null;
}

var COLS = {
  period:[["period","区间"],["start","起"],["end","止"],["close","期末收"],["dd_pct","期末回撤%"],["deepest_pct","最深回撤%"],["deepest_date","最深日"],["peak","历史峰值"],["days_since_peak","距高点(天)"]],
  daily:[["date","日期"],["close","收盘"],["peak","峰值"],["peak_date","峰值日"],["dd_pct","回撤%"],["days_since_peak","距高点(天)"],["state","状态"]],
  events:[["peak_date","峰值日"],["trough_date","谷值日"],["recover_date","修复日"],["drop_pct","跌幅%"],["recover_days","修复天数"],["ongoing","未修复"]]
};
var ROWS=[], PAGE_SIZE=60;

function renderTable(){
  var cols = COLS[STATE.view]||COLS.period;
  var thead = document.querySelector("#tbl thead"), tbody=document.querySelector("#tbl tbody");
  thead.innerHTML="<tr>"+cols.map(function(c){return "<th data-k='"+c[0]+"'>"+c[1]+"</th>"}).join("")+"</tr>";
  var start=STATE.page*PAGE_SIZE, page=ROWS.slice(start,start+PAGE_SIZE);
  tbody.innerHTML = page.map(function(r){
    return "<tr>"+cols.map(function(c){
      var v=r[c[0]];
      if(c[0].indexOf("pct")>=0 || c[0]==="drop_pct") return "<td class='"+cls(v)+"'>"+pct(v)+"</td>";
      if(c[0]==="close"||c[0]==="peak") return "<td>"+money(v)+"</td>";
      if(c[0]==="ongoing") return "<td>"+(v?"是":"—")+"</td>";
      return "<td>"+(v==null?"—":v)+"</td>";
    }).join("")+"</tr>";
  }).join("") || "<tr><td colspan='"+cols.length+"'>无数据</td></tr>";
  document.getElementById("pageInfo").textContent="第 "+(STATE.page+1)+" 页 / 共 "+Math.ceil(ROWS.length/PAGE_SIZE)+" 页（"+ROWS.length+" 行）";
}

function loadTable(reset){
  if(reset) STATE.page=0;
  var q = "id="+encodeURIComponent(STATE.ids[0])+"&gran="+STATE.gran
    +(STATE.dfrom?"&from="+STATE.dfrom:"")+(STATE.dto?"&to="+STATE.dto:"");
  fetch(api("table?"+q)).then(function(r){return r.json()}).then(function(d){
    TABLE = d;
    applyTable();
  }).catch(function(e){document.getElementById("tableHint").textContent="表格载入失败："+e});
}

function applyTable(){
  if(!TABLE) return;
  ROWS = STATE.view==="period"?(TABLE.periods||[]):STATE.view==="events"?(TABLE.events||[]):(TABLE.daily||[]);
  document.getElementById("tableHint").textContent=(TABLE.name||"")+" · "+ROWS.length+" 行";
  renderTable();
}

function reconList(){
  return (CATALOG && CATALOG.reconstruct)
      || (PAYLOAD && PAYLOAD.reconstruct && PAYLOAD.reconstruct.available) || [];
}
// 当前叠加选择中「支持溢价/汇率还原」的标的（跟着 chip 走，而不是固定第一只）
function reconHits(){
  var byEtf = {};
  reconList().forEach(function(r){ byEtf[r.etf] = r; });
  return (STATE.ids || []).map(function(id){ return byEtf[id]; }).filter(Boolean);
}
function rcSelWrap(show){
  var w = document.getElementById("rcSelWrap");
  if(w) w.style.display = show ? "" : "none";
}
function syncRcSel(){
  var sel = document.getElementById("rcSel");
  if(sel && STATE.rcEtf) sel.value = STATE.rcEtf;
}
function noHitNote(){
  var names = (STATE.ids || []).map(function(id){
    var a = ((CATALOG && CATALOG.assets) || []).find(function(x){ return x.id === id; });
    return a ? a.name : id;
  }).join("、");
  return "当前叠加的 "+names+" 无海外敞口（不涉及汇率/溢价），下列为可还原标的的曲线；"
       + "若要对比真实涨跌，请在上方勾选纳指/标普/日经/德国/法国 ETF。";
}
function showRcNote(txt){
  var el = document.getElementById("rcNote");
  el.style.display = "block";
  el.textContent = txt;
}

function loadReconstruct(){
  if(window.__STATIC__){
    // 静态站 data.json 只带首只还原标的（避免体积膨胀），无网络 API
    var d = (PAYLOAD&&PAYLOAD.reconstruct)||{};
    if(STATE.rcEtf && d.available){
      var hit=d.available.find(function(x){return x.etf===STATE.rcEtf});
      if(!hit){ RECON={error:1,msg:"静态快照仅含首只还原标的，请在服务端模式查看其他标的"}; renderReconstruct(RECON); return; }
    }
    RECON = d.current; renderReconstruct(RECON); return;
  }
  var hits = reconHits();
  if(hits.length === 1){                       // 叠加里只有一只可还原 → 四曲线详情
    STATE.rcEtf = hits[0].etf; syncRcSel(); rcSelWrap(false);
    loadOneRecon(hits[0].etf, "");
    return;
  }
  if(hits.length > 1){                         // 叠加多只可还原 → 按叠加对比
    rcSelWrap(false);
    loadManyRecon(hits);
    return;
  }
  // 叠加里一只都不支持还原 → 用下拉选的那只，并说明原因（否则用户会以为「选什么都只出纳指ETF」）
  rcSelWrap(true);
  loadOneRecon(STATE.rcEtf || (reconList()[0] || {}).etf, noHitNote());
}

function loadOneRecon(etf, note){
  if(!etf) return;
  STATE.rcEtf = etf;
  var seq = ++RC_SEQ;
  document.getElementById("chartHint").textContent = "还原曲线载入中…";
  function done(d){
    if(seq !== RC_SEQ) return;            // 期间又发起了新请求 → 丢弃本次过期结果
    RECON = (d && d.current) ? d.current : d;
    renderReconstruct(RECON);
    if(note) showRcNote(note + " " + ((RECON && RECON.note) || ""));
  }
  if(RC_CACHE[etf]){ done(RC_CACHE[etf]); return; }
  fetch(api("reconstruct?etf="+encodeURIComponent(etf)))
    .then(function(r){return r.json()})
    .then(function(d){ RC_CACHE[etf]=d; done(d); })
    .catch(function(e){ if(seq === RC_SEQ) document.getElementById("chartHint").textContent="还原载入失败："+e; });
}

function loadManyRecon(hits){
  var seq = ++RC_SEQ;
  document.getElementById("chartHint").textContent = "还原曲线载入中（"+hits.length+" 只）…";
  var jobs = hits.map(function(h){
    if(RC_CACHE[h.etf]) return Promise.resolve(RC_CACHE[h.etf]);
    return fetch(api("reconstruct?etf="+encodeURIComponent(h.etf)))
      .then(function(r){return r.json()})
      .then(function(d){ RC_CACHE[h.etf]=d; return d; });
  });
  Promise.all(jobs).then(function(list){
    if(seq !== RC_SEQ) return;
    var curves = list.map(function(d){ return (d && d.current) ? d.current : d; })
                     .filter(function(c){ return c && c.curves && !c.error; });
    if(!curves.length){ RECON={error:1,msg:"叠加的标的中暂无可用的还原数据"}; renderReconstruct(RECON); return; }
    renderReconMany(curves);
  }).catch(function(e){ if(seq === RC_SEQ) document.getElementById("chartHint").textContent="还原载入失败："+e; });
}

var RC_MULTI = ["#d92b2b","#2f5fd0","#12924a","#8a5b00","#7b3fa0","#0e7c86"];
// 多只叠加：每只一条「还原%」（实线，剔溢价+汇率=真实涨跌）+ 一条「场内价%」（细虚线），
// 跟踪基准按名称去重后画灰色点线（同基准只画一条）。
function renderReconMany(curves){
  var el = document.getElementById("chart");
  if(!CHART){ el.innerHTML=""; CHART = echarts.init(el); }
  var series = [], legend = [], benchSeen = {};
  var pctFmt = function(v){ return v==null?"—":Number(v).toFixed(2)+"%"; };
  curves.forEach(function(c, i){
    var col = RC_MULTI[i % RC_MULTI.length];
    var n1 = c.name+" 还原%（剔溢价+汇率）", n2 = c.name+" 场内价%（含溢价+汇率）";
    series.push({name:n1, type:"line", data:c.curves.restored, showSymbol:false,
      sampling:"lttb", lineStyle:{width:2.2,color:col}, itemStyle:{color:col},
      tooltip:{valueFormatter:pctFmt}});
    legend.push(n1);
    series.push({name:n2, type:"line", data:c.curves.price, showSymbol:false,
      sampling:"lttb", lineStyle:{width:1,type:"dashed",opacity:.55,color:col},
      itemStyle:{color:col}, tooltip:{valueFormatter:pctFmt}});
    legend.push(n2);
    if(!benchSeen[c.bench_name]){
      benchSeen[c.bench_name] = 1;
      var nb = "基准·"+c.bench_name+"（本币）";
      series.push({name:nb, type:"line", data:c.curves.bench, showSymbol:false,
        sampling:"lttb", lineStyle:{width:1.2,type:"dotted",color:"#8a8f98"},
        itemStyle:{color:"#8a8f98"}, tooltip:{valueFormatter:pctFmt}});
      legend.push(nb);
    }
  });
  var option = {
    animation:false,
    legend:{data:legend,top:0,type:"scroll"},
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},valueFormatter:pctFmt},
    grid:{left:60,right:24,top:52,bottom:64},
    xAxis:{type:"time"},
    yAxis:{type:"value",name:"累计涨跌%",axisLabel:{formatter:"{value}%"}},
    dataZoom:[
      {type:"inside",start:0,end:100},
      {type:"slider",bottom:6,height:20,start:0,end:100}
    ],
    series:series
  };
  CHART.setOption(option,true);
  document.getElementById("chartHint").textContent =
    "叠加还原对比 · "+curves.length+" 只 · 各线以自身起点=0%";
  showRcNote("实线=还原%（剔溢价+汇率，即真实涨跌）；细虚线=场内价%（含溢价+汇率）；灰色点线=跟踪基准（本币）。");
}

function initReconstruct(){
  var list = reconList();
  if(!list.length) return;
  var sel = document.getElementById("rcSel"); sel.innerHTML="";
  list.forEach(function(r){
    var o=document.createElement("option"); o.value=r.etf;
    o.textContent=r.name+" → "+r.bench_name; sel.appendChild(o);
  });
  STATE.rcEtf = STATE.rcEtf || list[0].etf;
  sel.value = STATE.rcEtf;
}

function refreshAll(){
  if(STATE.fx){ loadReconstruct(); loadTable(true); return; }
  var q="ids="+encodeURIComponent(STATE.ids.join(","))
    +(STATE.dfrom?"&from="+STATE.dfrom:"")+(STATE.dto?"&to="+STATE.dto:"");
  fetch(api("series?"+q)).then(function(r){return r.json()}).then(function(d){
    SERIES=d; renderChart(d);
    var n=d.series.reduce(function(a,x){return a+x.points},0);
    document.getElementById("chartHint").textContent = hintText(STATE.dfrom, n);
  }).catch(function(e){document.getElementById("chartHint").textContent="图表载入失败："+e});
  fetch(api("signals?ids="+encodeURIComponent(STATE.ids.join(",")))).then(function(r){return r.json()}).then(function(d){renderSignals(d.signals)}).catch(function(){});
  loadTable(true);
}

function boot(){
  fetch(api("payload")).then(function(r){return r.json()}).then(function(d){
    PAYLOAD=d;
    STATE.ids=(d.catalog.default_ids||[]).filter(function(id){var a=d.catalog.assets.find(function(x){return x.id===id});return a&&a.ready});
    if(!STATE.ids.length){var r=d.catalog.assets.filter(function(a){return a.ready});STATE.ids=r.slice(0,4).map(function(a){return a.id})}
    renderGroups(d.catalog);
    initReconstruct();
    renderSignals(d.signals);
    SERIES=d.series; renderChart(d.series);
    TABLE=d.table; applyTable();
    document.getElementById("freshness").textContent="抓取："+(d.catalog.last_fetch||"—")+" · 重算："+(d.catalog.last_rebuild||"—");
    // 「起」输入框不预填（否则会误以为已按该日起算），只用 placeholder 提示首只标的最早数据日
    var _f=d.catalog.assets.find(function(a){return a.id===STATE.ids[0]});
    var _in=document.getElementById("dfrom");
    if(_in){ _in.value=""; if(_f&&_f.actual_from) _in.placeholder=_f.actual_from; }
  }).catch(function(e){
    document.getElementById("freshness").textContent="数据载入失败："+e;
  });
}

document.getElementById("apply").onclick=function(){
  STATE.dfrom=document.getElementById("dfrom").value;
  STATE.dto=document.getElementById("dto").value;
  refreshAll();
};
document.getElementById("reset").onclick=function(){
  STATE.dfrom=STATE.dto="";
  document.getElementById("dfrom").value=document.getElementById("dto").value="";
  refreshAll();
};
["period","daily","events"].forEach(function(v){
  var b=document.getElementById("view-"+v);
  if(b) b.onclick=function(){
    STATE.view=v; STATE.page=0;
    ["period","daily","events"].forEach(function(x){var el=document.getElementById("view-"+x);if(el)el.classList.toggle("primary",x===v)});
    applyTable();
  };
});
document.getElementById("prev").onclick=function(){if(STATE.page>0){STATE.page--;renderTable()}};
document.getElementById("next").onclick=function(){if((STATE.page+1)*PAGE_SIZE<ROWS.length){STATE.page++;renderTable()}};
document.getElementById("fxAdjust").onchange=function(){
  STATE.fx=this.checked;
  document.getElementById("rcNote").style.display=STATE.fx?"":"none";
  if(STATE.fx){ loadReconstruct(); }          // rcSelWrap 由 loadReconstruct 决定显隐
  else { rcSelWrap(false); renderChart(SERIES||PAYLOAD.series); }
};
document.getElementById("rcSel").onchange=function(){
  STATE.rcEtf=this.value;
  if(STATE.fx) loadOneRecon(STATE.rcEtf, noHitNote());
};

boot();
</script>
